name: Publish gameplay film
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'media/*.mp4'
      - 'media/poster-*.jpg'
      - 'subtitles/*.srt'
      - 'assets/mac/A2ACraft.iconset/icon_128x128.png'
      - '.github/workflows/film-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: film-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 site/build.py _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy film
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
