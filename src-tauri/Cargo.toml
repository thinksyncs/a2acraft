[package]
name = "chat-ui-tauri"
version = "0.4.27"
description = "A2ACraft desktop application by Toppy"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["dynamic-acl"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6"
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebView", "WKWebViewConfiguration", "WKPreferences"] }

# Backport of gtk-rs-core#1343 while the GTK 0.18 stack is required by Tauri.
[patch.crates-io]
glib = { path = "vendor/glib" }
