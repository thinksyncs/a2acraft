[package]
name = "chat-ui-tauri"
version = "0.4.23"
description = "A2ACraft desktop application by Toppy"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["dynamic-acl"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
getrandom = "0.3"

# Backport of gtk-rs-core#1343 while the GTK 0.18 stack is required by Tauri.
[patch.crates-io]
glib = { path = "vendor/glib" }
